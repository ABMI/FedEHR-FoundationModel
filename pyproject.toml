[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ausom-ehr-gpt2"
version = "0.1.0"
description = "AUSOM OMOP EHR GPT-2 foundation model and federated learning experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "polars>=1.43,<2",
  "pyarrow>=20",
  "torch>=2.4",
  "transformers>=4.44,<5",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.4",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Collect tests only from tests/ (not from outputs/).
testpaths = ["tests"]
